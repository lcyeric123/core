name: 编译魚柳 Office

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 配置 ccache 缓存
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: libreoffice-build
      
      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ccache \
            git \
            autoconf \
            automake \
            libtool \
            pkg-config \
            python3 \
            python3-dev \
            libxml2-dev \
            libxslt1-dev \
            libssl-dev \
            libcurl4-openssl-dev \
            libgtk-3-dev \
            libepoxy-dev \
            libcairo2-dev \
            libpango1.0-dev \
            libharfbuzz-dev \
            libfreetype6-dev \
            libfontconfig1-dev \
            libjpeg-dev \
            libpng-dev \
            libtiff-dev \
            libgif-dev \
            libicu-dev \
            libboost-dev \
            libpoppler-dev \
            libpoppler-cpp-dev \
            liblangtag-dev \
            libmythes-dev \
            libhunspell-dev \
            libhyphen-dev \
            libwpd-dev \
            libwpg-dev \
            libwps-dev \
            libmwaw-dev \
            libodfgen-dev \
            libe-book-dev \
            libetonyek-dev \
            libabw-dev \
            libfreehand-dev \
            libpagemaker-dev \
            libqxp-dev \
            libstaroffice-dev \
            libzmf-dev \
            libvisio-dev \
            libcdr-dev \
            libcmis-dev \
            libgpgme-dev \
            libgpg-error-dev \
            libassuan-dev \
            libnspr4-dev \
            libnss3-dev \
            libdbus-1-dev \
            libexpat1-dev \
            zlib1g-dev \
            libzip-dev \
            unzip \
            zip \
            wget \
            curl
      
      - name: 配置编译选项
        run: |
          ./autogen.sh \
            --prefix=/opt/yuliu-office \
            --without-java \
            --without-doxygen \
            --disable-odk \
            --disable-postgresql-sdbc \
            --disable-firebird-sdbc \
            --disable-pdfimport \
            --disable-report-builder \
            --enable-gtk3 \
            --with-system-libs \
            --with-system-headers \
            CC="ccache gcc" \
            CXX="ccache g++"
      
      - name: 开始编译
        run: |
          make -j$(nproc)
      
      - name: 打包安装文件
        run: |
          make install DESTDIR=$PWD/install
          tar -czf yuliu-office-linux-x86_64.tar.gz -C install opt/
      
      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: yuliu-office-linux-x86_64
          path: yuliu-office-linux-x86_64.tar.gz
          
